---
name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# shellcheck is not here: it runs as part of `task test` (onpr_test.yaml), via
# tests/shellcheck.sh, which honours each script's shebang and has a baseline.

jobs:
  hadolint:
    name: 🔎 hadolint
    runs-on: ubuntu-latest
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 🔎 Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          # What is left after .hadolint.yaml is mostly "delete the apt lists" and
          # "use --no-install-recommends", which are style calls on images that are
          # not ours to restructure. Errors are the ones worth blocking on. Lower
          # this to warning once the current crop is dealt with.
          failure-threshold: error

  yamllint:
    name: 🔎 yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1

      # Not preinstalled on the runner image.
      - name: 🐍 Install yamllint
        run: pipx install yamllint

      # No --strict, so warnings are reported without failing, matching the
      # hadolint job above. Errors fail in both.
      - name: 🔎 Run yamllint
        run: yamllint --format github .
