# yamllint disable rule:line-length
# inspired from https://github.com/Poeschl/Hassio-Addons
---
name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "**/config.*"

jobs:
  check-addon-changes:
    runs-on: ubuntu-latest
    outputs:
      changedAddons: ${{ steps.released.outputs.addons }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 📂 Detect changed files
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/paths-filter.yml

      # Only a release publishes. A config.yaml change that keeps the version
      # (e.g. a schema fix waiting for the next release) would otherwise push new
      # contents under an already-published version, which existing installs
      # never pick up.
      - name: 🏷️ Keep only add-ons whose version changed
        id: released
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          BEFORE: ${{ github.event.before }}
        run: |
          version_at() {
            git show "$1:$2/config.yaml" 2>/dev/null \
              | sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p'
          }
          released=()
          for addon in $(echo "${CHANGED:-[]}" | jq -r '.[]'); do
            old=$(version_at "$BEFORE" "$addon")
            new=$(version_at HEAD "$addon")
            if [[ "$old" != "$new" ]]; then
              echo "$addon: ${old:-<new>} -> $new, publishing"
              released+=("$addon")
            else
              echo "$addon: config changed but version is still $new, not publishing"
            fi
          done
          echo "addons=$(printf '%s\n' "${released[@]}" | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  lint_config:
    if: ${{ needs.check-addon-changes.outputs.changedAddons != '[]' }}
    needs: check-addon-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.check-addon-changes.outputs.changedAddons) }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1
      - name: 🔎 Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: "./${{ matrix.addon }}"

  # One matrix entry per released add-on and architecture it supports, with
  # the image name, version, base image and labels resolved. See
  # scripts/publish-matrix.sh (runnable locally).
  plan:
    if: ${{ needs.check-addon-changes.outputs.changedAddons != '[]' }}
    needs: check-addon-changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      manifests: ${{ steps.matrix.outputs.manifests }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 🧮 Build matrix
        id: matrix
        env:
          ADDONS: ${{ needs.check-addon-changes.outputs.changedAddons }}
        run: |
          matrix="$(./scripts/publish-matrix.sh "$ADDONS")"
          manifests="$(./scripts/publish-matrix.sh --manifests "$ADDONS")"
          echo "$matrix" | jq .
          echo "$manifests" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "manifests=$manifests" >> "$GITHUB_OUTPUT"

  # Built with home-assistant/builder's composable actions (the monolithic
  # home-assistant/builder action is deprecated and due for removal). Per-arch
  # add-ons (image: ...-{arch}) push one image per architecture, with the base
  # from build.json/build.yaml; generic ones push <arch>-name images with the
  # Dockerfile's own FROM and get a manifest in the job below.
  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    environment: CR_PAT
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    permissions:
      contents: read
      id-token: write  # Cosign signing
      packages: write  # push to ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: ↩️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 🏗️ Build and publish ${{ matrix.addon }} (${{ matrix.arch }})
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ matrix.addon }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ matrix.version }}
            latest
          version: ${{ matrix.version }}
          build-args: ${{ matrix.build_args }}
          labels: ${{ matrix.labels }}
          # Several add-ons share this repository, so keep their caches apart.
          cache-gha-scope: ${{ matrix.addon }}-${{ matrix.arch }}
          push: "true"
          # Never overwrite an already published version.
          skip-existing: ${{ matrix.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Add-ons with a generic image name (image: ghcr.io/owner/name, no {arch})
  # get one multi-arch manifest combining the per-arch images built above.
  # Per-arch add-ons (image: ...-{arch}) don't need one and are skipped.
  manifest:
    needs: [plan, build]
    if: ${{ fromJSON(needs.plan.outputs.manifests).include[0] != null }}
    runs-on: ubuntu-latest
    environment: CR_PAT
    name: Publish ${{ matrix.addon }} multi-arch manifest
    permissions:
      contents: read
      id-token: write  # Cosign signing
      packages: write  # push to ghcr.io
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.manifests) }}
    steps:
      - name: 📦 Publish ${{ matrix.addon }} manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ matrix.architectures }}
          registry-prefix: ${{ matrix.registry_prefix }}
          image-name: ${{ matrix.image_name }}
          image-tags: |
            ${{ matrix.version }}
            latest
          skip-existing: ${{ matrix.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
