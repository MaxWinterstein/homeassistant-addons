# Which files can change an add-on's image. onpr_check-pr.yaml uses this to decide
# which add-ons a pull request has to lint and test-build, so a Dockerfile-only change
# (every Renovate base-image bump) gets built before it is merged.
#
# Everything under the add-on directory counts, except documentation, artwork and
# pending changelog fragments. Needs `predicate-quantifier: some-with-excludes`: under
# the default `some`, a negated pattern matches every file it does not name, so every
# filter would match everything.
#
# Publishing is separate: onpush_build.yaml still only builds when config.* changes,
# i.e. on a release, so nothing is republished under an existing version number.
#
# eufy-ha-mqtt-bridge, ioBroker and portainer are deprecated and not listed.

adsb-multi-portal-feeder:
  - "adsb-multi-portal-feeder/**"
  - "!adsb-multi-portal-feeder/*.md"
  - "!adsb-multi-portal-feeder/*.png"
  - "!adsb-multi-portal-feeder/images/**"
  - "!adsb-multi-portal-feeder/changelog.d/**"

